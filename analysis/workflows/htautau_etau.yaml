# ==================================================================================
# H -> tautau + charm, e tau_h channel (2024, Summer24 NanoAODv15)
# Triggers (quick_trigg_study): Ele30 | Ele24_PNetTau30 (| Ele24_DeepTau30, DoublePNetTau30, DoubleDeepTau35:
# study axes only)
# Trigger regions (exclusive in the electron pT, HLT bit + offline gate + TrigObj matching), 2026-09-16:
#   trig_singleele : Ele30 WPTight,         e pT > 32, e matched to the 1e leg (filter bit 18)
#                    -> SF: EGM Electron-HLT-SF HLT_SF_Ele30_MVAiso90ID (SC eta). The gate is 32, not 30: the
#                    30-32 GeV bin is on the turn-on (data eff 0.4-0.5, SF ~0.70 in the barrel); those
#                    electrons go to the cross region instead, at no yield cost.
#   trig_crossele  : Ele24 + PNet tau30,    25 < e pT <= 32, |eta_e| < 2.1, tau_h pT > 24.6 (object cut),
#                    |eta_tau| < 2.1, both legs matched to the PNet 1e-1tau legs (e bit 17, tau bit 12)
#                    -> SF: TAU tau_trigger `etau` (DM-binned; tagger very probably PNet) on the tau_h leg; the
#                    Ele24 leg has no 2024 SF (SF = 1): the datacard needs a normalisation lnN on this region
#                    (~25 % of `trigger`) until a tag-and-probe measurement exists.
#   trig_ditau_extra (NOT in `trigger` since 2026-09-16; own monitoring category): di-tau paths with no
#                    EGamma path fired, the electron fires an HLT tau leg -> no SF can exist (~7 % of the
#                    MC yield). The DeepTau cross path has no SF and added 0.3 %: dropped.
# tau_h objects from 24.6 GeV (lower edge of the tau_trigger fit range; the single-e region has no tau
# trigger requirement). Expected yields (replay of 2026-09-16, 108.96/fb, with trigger SFs): cH 5.56,
# bH 42.2 (+18.5 % w.r.t. e > 30 / tau > 30 gates; single-e > 32 only would give 3.51 / 26.2).
# ==================================================================================
extends: includes/htautau_common
object_selection:
  electrons:                       # the full list (deep_merge replaces lists): |eta| < 2.5 branch from 32 GeV
    field: events.Electron
    cuts:
      # Ele24 cross leg (25, |eta| < 2.1) OR Ele30 leg (32 = trig_singleele gate)
      - ((events.Electron.pt > 25) & (np.abs(events.Electron.eta) < 2.1)) | ((events.Electron.pt > 32) & (np.abs(events.Electron.eta) < 2.5))
      - working_points.electron_id(events, 'wp90iso')
      - ~((np.abs(events.Electron.superclusterEta) > 1.44) & (np.abs(events.Electron.superclusterEta) < 1.57))
      - np.abs(events.Electron.dxy) < 0.045
      - np.abs(events.Electron.dz) < 0.2
  taus:
    field: events.Tau
    cuts:
      - events.Tau.pt > 24.6               # lower edge of the tau_trigger etau SF fit range
      - np.abs(events.Tau.eta) < 2.3
      - working_points.tau_decay_mode(events)
      - working_points.tau_id_vsjet(events, 'Medium')
      - working_points.tau_id_vse(events, 'VVLoose')
      - working_points.tau_id_vsmu(events, 'VLoose')
      - np.abs(events.Tau.dz) < 0.2
      - np.abs(events.Tau.charge) == 1
      - delta_r_higher(events.Tau, objects['veto_muons'], 0.5)
      - delta_r_higher(events.Tau, objects['veto_electrons'], 0.5)
  taus_study:
    field: events.Tau
    cuts:
      - events.Tau.pt > 30
      - np.abs(events.Tau.eta) < 2.3
      - working_points.tau_decay_mode(events, (0, 1, 2, 10, 11))
      - working_points.tau_id_vsjet(events, 'Medium')
      - working_points.tau_id_vsmu(events, 'Loose')
      - working_points.tau_id_vse(events, 'Loose')
  htt_pair:
    field: select_htt_pair_etau
event_selection:
  hlt_paths:                       # dict order = primary-dataset priority for data
    EGamma:
      - EleTau_PNet
      - SingleEle
      - EleTau_DeepTau
    Tau:
      - DiTau_PNet
      - DiTau_DeepTau
  selections:
    trig_singleele: get_trigger_region_mask(events, hlt_paths, dataset, year, ['SingleEle']) & ak.fill_none(objects['l1'].pt > 32, False) & objects['l1_match_singleele']
    trig_crossele: get_trigger_region_mask(events, hlt_paths, dataset, year, ['EleTau_PNet']) & ak.fill_none((objects['l1'].pt > 25) & (objects['l1'].pt <= 32) & (np.abs(objects['l1'].eta) < 2.1) & (np.abs(objects['l2'].eta) < 2.1), False) & objects['l1_match_etau'] & objects['l2_match_etau']
    trig_ditau_extra: ~get_trigger_flags_or(events, ['EleTau_PNet', 'SingleEle', 'EleTau_DeepTau'], year) & ((get_trigger_region_mask(events, hlt_paths, dataset, year, ['DiTau_PNet']) & ak.fill_none((objects['l1'].pt > 30) & (objects['l2'].pt > 30), False)) | (get_trigger_region_mask(events, hlt_paths, dataset, year, ['DiTau_DeepTau']) & ak.fill_none((objects['l1'].pt > 35) & (objects['l2'].pt > 35), False))) & ak.fill_none(np.abs(objects['l2'].eta) < 2.1, False) & objects['l1_match_ditau'] & objects['l2_match_ditau']
    trigger: selection_masks['trig_singleele'] | selection_masks['trig_crossele']   # trig_ditau_extra: monitoring only (no SF)
    one_electron: ak.num(objects['electrons']) == 1
    no_extra_electron: ak.num(objects['veto_electrons']) == 1
    muon_veto: ak.num(objects['veto_muons']) == 0
    atleast_one_tau: ak.num(objects['taus']) >= 1
    study_den: (ak.num(objects['electrons_study']) >= 1) & (ak.num(objects['taus_study']) >= 1)
  categories:
    gen_etau:
      - gen_etau
    den_etau_study:
      - study_den
    sel_etau:
      - goodvertex
      - lumimask
      - met_filters
      - one_electron
      - no_extra_electron
      - muon_veto
      - atleast_one_tau
      - one_pair
      - os_pair
    sel_etau_trig:
      - goodvertex
      - lumimask
      - met_filters
      - trigger
      - one_electron
      - no_extra_electron
      - muon_veto
      - atleast_one_tau
      - one_pair
      - os_pair
    sel_etau_trig_genetau:
      - goodvertex
      - lumimask
      - met_filters
      - trigger
      - one_electron
      - no_extra_electron
      - muon_veto
      - atleast_one_tau
      - one_pair
      - os_pair
      - gen_etau
    sel_etau_trig_ditauextra:      # events taken by the di-tau paths only (no trigger SF possible; not part of `trigger`)
      - goodvertex
      - lumimask
      - met_filters
      - trig_ditau_extra
      - one_electron
      - no_extra_electron
      - muon_veto
      - atleast_one_tau
      - one_pair
      - os_pair
corrections:
  event_weights:
    muon: false
    electron:                              # the full lists: deep_merge replaces lists
      - id: wp90iso
      - reco: true
      - trigger:                           # EGM Ele30 SF in the single-electron region only
          regions: {Ele30: trig_singleele}
          categories: ["sel_etau_trig", "sel_etau_trig_genetau"]
    tau:
      - vsjet: Medium
      - vse: VVLoose
      - vsmu: VLoose
      - trigger:                           # TAU POG tau_trigger on the tau_h leg of the cross region
          regions: {etau: trig_crossele}
          categories: ["sel_etau_trig", "sel_etau_trig_genetau"]
plotting:
  category_labels:
    gen_etau: 1_gen_full_region
    den_etau_study: 2_trigger_study_denominator
    sel_etau: 3_selection_no_trigger
    sel_etau_trig: 4_selection_trigger
    sel_etau_trig_genetau: 5_selection_trigger_truthmatched
    sel_etau_trig_ditauextra: 6_selection_ditau_trigger_extra
  group_labels:
    lepton: electron
  groups:
    lepton: ["ele_*"]
histogram_config:
  add_syst_axis: true
  add_weight: true
  axes:
    ele_pt: {type: Regular, bins: 60, start: 0, stop: 300, label: '$p_T(e)$ [GeV]', expression: 'objects[''l1''].pt'}
    ele_eta: {type: Regular, bins: 50, start: -2.5, stop: 2.5, label: $\eta(e)$, expression: 'objects[''l1''].eta'}
    ele_phi: {type: Regular, bins: 50, start: -3.14159, stop: 3.14159, label: $\phi(e)$, expression: 'objects[''l1''].phi'}
    ele_iso: {type: Regular, bins: 50, start: 0, stop: 0.3, label: $e$ rel. isolation, expression: 'objects[''l1''].pfRelIso03_all'}
    ele_dxy: {type: Regular, bins: 50, start: -0.05, stop: 0.05, label: '$e$ $d_{xy}$ [cm]', expression: 'objects[''l1''].dxy'}
    ele_dz: {type: Regular, bins: 50, start: -0.2, stop: 0.2, label: '$e$ $d_z$ [cm]', expression: 'objects[''l1''].dz'}
    ele_charge:
      type: IntCategory
      categories: [-1, 1]
      label: $e$ charge
      expression: objects['l1'].charge
    ele_genflav:
      type: IntCategory
      categories: [0, 1, 3, 4, 5, 15, 22]
      label: $e$ genPartFlav
      expression: objects['l1'].genPartFlav
      mc_only: true
    ele_mvaIso_WP80:
      type: IntCategory
      categories: [0, 1]
      label: $e$ mvaIso_WP80
      expression: ak.values_astype(ak.fill_none(objects['l1'].mvaIso_WP80, False), int)
    ele_mvaIso_WP90:
      type: IntCategory
      categories: [0, 1]
      label: $e$ mvaIso_WP90
      expression: ak.values_astype(ak.fill_none(objects['l1'].mvaIso_WP90, False), int)
    ele_mvaNoIso_WP90:
      type: IntCategory
      categories: [0, 1]
      label: $e$ mvaNoIso_WP90
      expression: ak.values_astype(ak.fill_none(objects['l1'].mvaNoIso_WP90, False), int)
    ele_sceta: {type: Regular, bins: 50, start: -2.5, stop: 2.5, label: '$\eta_{SC}(e)$', expression: 'objects[''l1''].superclusterEta'}
    turnon_lepton_pt:
      type: Variable
      edges: &id002 [25, 27, 29, 30, 31, 32, 33, 35, 40, 45, 50, 60, 80, 120]
      label: leading $e$ $p_T$ [GeV]
      expression: ak.fill_none(objects['electrons_lead'].pt, np.nan)
    turnon_lepton_eta:
      type: Variable
      edges: &id001 [-2.5, -2.4, -2.3, -2.1, -1.6, -1.2, -0.8, -0.4, 0, 0.4, 0.8, 1.2, 1.6, 2.1, 2.3, 2.4, 2.5]
      label: leading $e$ $\eta$
      expression: ak.fill_none(objects['electrons_lead'].eta, np.nan)
    turnon_tau_pt:
      type: Variable
      edges: [0, 20, 22, 24.6, 27, 30, 32.5, 35, 37.5, 40, 45, 50, 55, 60, 70, 85, 110, 150]
      label: leading $\tau_h$ $p_T$ [GeV]
      expression: ak.fill_none(objects['taus_lead'].pt, np.nan)
    turnon_gen_lepton_pt:
      type: Variable
      edges: [0, 5, 10, 15, 20, 22, 25, 27, 29, 30, 31, 32, 33, 35, 40, 45, 50, 60, 80, 120]
      label: gen $e$ $p_T$ [GeV]
      expression: ak.fill_none(objects['gen_lepton'].pt, np.nan)
    turnon_gen_lepton_eta:
      type: Variable
      edges: *id001
      label: gen $e$ $\eta$
      expression: ak.fill_none(objects['gen_lepton'].eta, np.nan)
    turnon_gen_tau_pt:
      type: Variable
      edges: [0, 10, 15, 20, 25, 30, 32.5, 35, 37.5, 40, 45, 50, 55, 60, 70, 85, 110, 150]
      label: gen $\tau_h^{vis}$ $p_T$ [GeV]
      expression: ak.fill_none(objects['gen_vistau1'].pt, np.nan)
    turnon_study_lepton_pt:
      type: Variable
      edges: *id002
      label: leading $e$ $p_T$ [GeV] (study objects)
      expression: ak.fill_none(objects['electrons_study_lead'].pt, np.nan)
    pass_EleTau_PNet: {type: Boolean, label: EleTau_PNet, expression: 'get_trigger_flag_mask(events, ''EleTau_PNet'', year)'}
    pass_SingleEle: {type: Boolean, label: SingleEle, expression: 'get_trigger_flag_mask(events, ''SingleEle'', year)'}
    pass_DiTau_PNet: {type: Boolean, label: DiTau_PNet, expression: 'get_trigger_flag_mask(events, ''DiTau_PNet'', year)'}
    pass_DiTau_DeepTau: {type: Boolean, label: DiTau_DeepTau, expression: 'get_trigger_flag_mask(events, ''DiTau_DeepTau'', year)'}
    pass_EleTau_DeepTau: {type: Boolean, label: EleTau_DeepTau, expression: 'get_trigger_flag_mask(events, ''EleTau_DeepTau'', year)'}
    pass_union: {type: Boolean, label: passes the trigger union (pure OR of the adopted paths), expression: 'get_trigger_flags_or(events, [''EleTau_PNet'', ''SingleEle'', ''DiTau_PNet'', ''DiTau_DeepTau'',
        ''EleTau_DeepTau''], year)'}
    pass_trig_singleele: {type: Boolean, label: passes the gated trigger region trig_singleele, expression: 'selection_masks[''trig_singleele'']'}
    pass_trig_crossele: {type: Boolean, label: passes the gated trigger region trig_crossele, expression: 'selection_masks[''trig_crossele'']'}
    pass_trig_ditau_extra: {type: Boolean, label: 'di-tau extra region (monitoring, not in trigger)', expression: 'selection_masks[''trig_ditau_extra'']'}
    in_gen_acc: {type: Boolean, label: gen-level acceptance, expression: 'objects[''in_gen_acc_etau'']'}
    in_reco_acc: {type: Boolean, label: passes the reco selection, expression: 'category_masks[''sel_etau'']'}
  layout:
    ele_pt: [ele_pt]
    ele_eta: [ele_eta]
    ele_phi: [ele_phi]
    ele_iso: [ele_iso]
    ele_dxy: [ele_dxy]
    ele_dz: [ele_dz]
    ele_charge: [ele_charge]
    ele_genflav: [ele_genflav]
    ele_mvaIso_WP80: [ele_mvaIso_WP80]
    ele_mvaIso_WP90: [ele_mvaIso_WP90]
    ele_mvaNoIso_WP90: [ele_mvaNoIso_WP90]
    ele_sceta: [ele_sceta]
    trig_reco: [turnon_lepton_pt, pass_EleTau_PNet, pass_SingleEle, pass_DiTau_PNet, pass_DiTau_DeepTau, pass_EleTau_DeepTau, pass_union, pass_trigger, pass_trig_singleele, pass_trig_crossele, pass_trig_ditau_extra,
      gen_channel]
    trig_reco_eta: [turnon_lepton_eta, pass_EleTau_PNet, pass_SingleEle, pass_DiTau_PNet, pass_DiTau_DeepTau, pass_EleTau_DeepTau, pass_union, pass_trigger, pass_trig_singleele, pass_trig_crossele, pass_trig_ditau_extra]
    trig_reco_tau: [turnon_tau_pt, pass_EleTau_PNet, pass_SingleEle, pass_DiTau_PNet, pass_DiTau_DeepTau, pass_EleTau_DeepTau, pass_union, pass_trigger, pass_trig_singleele, pass_trig_crossele, pass_trig_ditau_extra]
    trig_reco_jet: [turnon_jet1_pt, pass_EleTau_PNet, pass_SingleEle, pass_DiTau_PNet, pass_DiTau_DeepTau, pass_EleTau_DeepTau, pass_union, pass_trigger, pass_trig_singleele, pass_trig_crossele, pass_trig_ditau_extra]
    trig_reco_met: [turnon_met_pt, pass_EleTau_PNet, pass_SingleEle, pass_DiTau_PNet, pass_DiTau_DeepTau, pass_EleTau_DeepTau, pass_union, pass_trigger, pass_trig_singleele, pass_trig_crossele, pass_trig_ditau_extra]
    trig_gen: [turnon_gen_lepton_pt, pass_EleTau_PNet, pass_SingleEle, pass_DiTau_PNet, pass_DiTau_DeepTau, pass_EleTau_DeepTau, pass_union, pass_trigger, pass_trig_singleele, pass_trig_crossele, pass_trig_ditau_extra,
      in_gen_acc, in_reco_acc]
    trig_gen_eta: [turnon_gen_lepton_eta, pass_EleTau_PNet, pass_SingleEle, pass_DiTau_PNet, pass_DiTau_DeepTau, pass_EleTau_DeepTau, pass_union, pass_trigger, pass_trig_singleele, pass_trig_crossele, pass_trig_ditau_extra,
      in_gen_acc, in_reco_acc]
    trig_gen_tau: [turnon_gen_tau_pt, pass_EleTau_PNet, pass_SingleEle, pass_DiTau_PNet, pass_DiTau_DeepTau, pass_EleTau_DeepTau, pass_union, pass_trigger, pass_trig_singleele, pass_trig_crossele, pass_trig_ditau_extra,
      in_gen_acc, in_reco_acc]
    trig_study: [turnon_study_lepton_pt, pass_EleTau_PNet, pass_SingleEle, pass_DiTau_PNet, pass_DiTau_DeepTau, pass_EleTau_DeepTau, pass_union, pass_trigger, pass_trig_singleele, pass_trig_crossele, pass_trig_ditau_extra]
    higgs_mass_vis_by_tauwp: [higgs_mass_vis_wp, l2_vse_tight, l2_vsjet_tight]
    higgs_pt_by_tauwp: [higgs_pt_wp, l2_vse_tight, l2_vsjet_tight]
    tau_pt_by_tauwp: [tau_pt_wp, l2_vse_tight, l2_vsjet_tight]
    mt_lepton_met_by_tauwp: [mt_lepton_met_wp, l2_vse_tight, l2_vsjet_tight]
    higgs_dzeta_by_tauwp: [higgs_dzeta_wp, l2_vse_tight, l2_vsjet_tight]
    higgs_mt_tot_by_tauwp: [higgs_mt_tot_wp, l2_vse_tight, l2_vsjet_tight]
    higgs_mass_col_by_tauwp: [higgs_mass_col_wp, l2_vse_tight, l2_vsjet_tight]

# Private Summer24 FullSim productions (NanoAODv15, HLT menu 2024v14), H -> tautau
# exclusive, no generator filter. xsec = sigma(pp -> H + c/b) x BR(H -> tautau):
#   cH 4FS: 97.0 fb x 0.0627 = 6.08 fb ; bH 5FS: 720.8 fb x 0.0627 = 45.2 fb
# (same production cross sections as the H+c/H+b -> WW filesets divided by the WW
# branching fraction). Files are globbed from EOS by make_signal_filesets.py (`path`).
# bH tranche0_test (5011 events, independent pilot merge) is excluded on purpose.

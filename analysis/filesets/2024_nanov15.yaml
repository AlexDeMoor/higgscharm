# ---------------------------------------------------------------------------------
# SM H(125) backgrounds (no ttH->tautau or ggZH->tautau sample exists in this campaign).
# sigma: LHC Higgs WG 13.6 TeV ("ad interim" extrapolation, mH = 125.00 GeV),
#   https://twiki.cern.ch/twiki/bin/view/LHCPhysics/LHCHWG136TeVxsec_extrap
# BR(H -> tautau) = 0.0627, as for the H+c/H+b signal entries below.
#   ggH  52.23 pb (N3LO QCD + NLO EW)          x 0.0627 = 3.2748 pb
#   VBF  4.078 pb                              x 0.0627 = 0.25569 pb
#   W+H  0.8889 pb, W-H 0.5677 pb              x 0.0627 = 0.055734 / 0.035595 pb
#   ZH   quark-initiated only (powhegMINNLO): ZH total 0.9439 - ggZH 0.1360 = 0.8079 pb x 0.0627 = 0.050655 pb
#        (ggZH -> tautau, 0.1360 x 0.0627 = 8.5 fb, is not covered by any sample)
#   ttH  0.5700 pb x (1 - BR(H -> bb) = 1 - 0.5824, YR4 mH = 125.00, TO CONFIRM) = 0.23803 pb;
#        TTH-HtoNon2B = every H decay except bb (WW, tautau, ZZ, gg, gamma gamma, ...), not H -> tautau only.
# WH/ZH samples use "UncorrelatedDecay" (tau spin correlations off), unfiltered.
# One key per process (get_workflow_key_process_map keeps one process per key).
GluGluHto2Tau:
  era: mc
  query: GluGluHto2Tau_Par-M-125_TuneCP5_13p6TeV_powhegMINNLO-pythia8/RunIII2024Summer24NanoAODv15-150X_mcRun3_2024_realistic_v2-v2/NANOAODSIM
